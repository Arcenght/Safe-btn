# --- Bluetooth ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="SafeBtn"
CONFIG_BT_MAX_CONN=1

# Pareamento com bonding (as chaves ficam salvas na flash)
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# --- Botao ---
CONFIG_GPIO=y

# --- Log (via USB CDC: compile com -S cdc-acm-console) ---
CONFIG_LOG=y
CONFIG_ASSERT=n
